<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clients</title>
</head>
<body>
<h4>Clients list</h4>
<table style="width: 800px">
    <thead>
    <tr>
        <td style="width: 60px">Id</td>
        <td style="width: 180px">Name</td>
        <td style="width: 280px">Address</td>
        <td style="width: 280px">Phones</td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.id}"></td>
        <td th:text="${client.name}"></td>
        <td th:text="${client.address != null ? client.address.street : ''}"></td>
        <td>
            <div th:each="phone : ${client.phones}" th:text="${phone.number}"></div>
        </td>
    </tr>
    </tbody>
</table>

<br/><br/>
<h4>Create client</h4>
<form action="/clients" method="post">
    Name<br/>
    <input type="text" name="name"/><br/>
    Address<br/>
    <input type="text" name="address"/><br/>
    Phones (comma separated)<br/>
    <input type="text" name="phones"/><br/><br/>
    <input type="submit" value="Create"/>
</form>
</body>
</html>
